# Dogfood eval dataset — real (NL-question, expected-command) pairs from
# the project author's actual zsh + bash history, recorded 2026-05-04.
#
# This is intentional dogfooding: the eval is performed against real shell
# history of someone who would actually use the tool, not synthetic or
# hand-curated data.
#
# Source: zsh + bash history of the project's primary author (tarun-ks)
# as of 2026-05-04.
#
# Corpus: 56 unique entries (6 gold positions across 5 NL queries + 50
# stratified distractors). Distractor sampling: uniform-stride-per-stratum
# (indices floor((i+0.5)*N/n)) over a 307-candidate pool extracted from
# zsh + bash history, after excluding gold variants, weak entries, and
# entries the scrubber doesn't currently catch (see CLAUDE.md §1 dual
# scrubber findings recorded with this commit). Per-category counts
# (~16% rate, with small upward bumps on tiny strata for representation):
#   containerization-bash: 3, cloud-auth: 5, database: 3, build-package: 2,
#   file-processing: 8, git-non-trivial: 1, project-specific: 28.
#
# Sanitization applied to source history:
#   hooksecure-platform → webhook-platform     (GCP project name; redundant suffix)
#   hooksecure-X        → webhook-platform-X   (service / repo names)
#   keycloak-hhsa       → auth-app-keycloak
#   hhsa                → auth-app
#   \d{6}-\d{6}-\d{6}  → XXXXXX-XXXXXX-XXXXXX  (billing IDs)
#   nyc_procurment_public → preserved (intentional; public NYC PASSPort dataset)

# corpus = 56 entries. Listed in: distractor stratum order, then golds.
# Order is presentational only — the ranker permutes freely.
