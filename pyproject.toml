[project]
name = "recall-mcp"
version = "0.0.1"
description = "Semantic shell history MCP server for Claude Desktop and Claude Code."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Tarun Sharma" }]
requires-python = ">=3.11"
keywords = [
  "mcp",
  "shell",
  "history",
  "semantic-search",
  "claude",
  "atuin",
  "zsh",
  "bash",
  "fish",
]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Operating System :: MacOS :: MacOS X",
  "Operating System :: POSIX :: Linux",
  "Topic :: Utilities",
]
dependencies = [
  "pydantic>=2.13",
  "sqlite-vec>=0.1.6",
  "sentence-transformers>=3.0",
  "numpy>=1.26",
  "typer>=0.12",
  "httpx>=0.27",
  "rapidfuzz>=3.0",
  "mcp>=1.0.0,<2.0.0",
]

# Mirror of [dependency-groups].dev below, exposed as a PEP 621 extra so
# `pip install -e ".[dev]"` works for non-uv users. PEP 735 dependency
# groups only land on pip 25+; optional-dependencies is universal. Keep
# this list and [dependency-groups].dev in sync — both must change together.
[project.optional-dependencies]
dev = [
  "pytest>=9.0",
  "pytest-asyncio>=1.3",
  "ruff>=0.15",
  "mypy>=1.20",
]

[project.scripts]
recall = "recall.cli:main"
recall-mcp = "recall.server:main"

[project.urls]
Homepage = "https://github.com/tarun-ks/recall-mcp"
Repository = "https://github.com/tarun-ks/recall-mcp"
Issues = "https://github.com/tarun-ks/recall-mcp/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
  "pytest>=9.0",
  "pytest-asyncio>=1.3",
  "ruff>=0.15",
  "mypy>=1.20",
]

[tool.hatch.build.targets.wheel]
packages = ["src/recall"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
  "E",   # pycodestyle errors
  "F",   # pyflakes
  "W",   # pycodestyle warnings
  "I",   # isort
  "B",   # flake8-bugbear
  "UP",  # pyupgrade
  "SIM", # flake8-simplify
  "RUF", # ruff-specific
  "T201", # 3.11: ban print() in stdio-bound code paths.
          # Print silently breaks MCP framing (CLAUDE.md §5). Tests +
          # CI scripts + the indexer CLI are not stdio-bound — see
          # per-file-ignores below.
]
# CLI summary uses U+00D7 (×) as the multiplier glyph in "semantic is N.NX×
# better" output and U+221E (∞) for the divide-by-zero ranker case. Both
# are intentional human-facing display chars, not confusables to flag.
allowed-confusables = ["×", "∞"]

[tool.ruff.lint.per-file-ignores]
# Tests may print() for debugging — they're ephemeral, not under stdio
# constraint. No test currently prints; the entry declares policy for
# future contributors.
"tests/**/*.py" = ["T201"]
# CI helper scripts run in the GitHub Actions runner; not stdio-bound.
".github/scripts/*.py" = ["T201"]
# `recall index` is a CLI command run by the user; its stderr progress
# lines are user-facing terminal output. Distinct from the MCP `recall
# serve` stdio path. The custom AST check (test_stdio_cleanliness.py)
# still rejects print(..., file=sys.stdout) here — only blanket T201
# is relaxed.
"src/recall/indexer.py" = ["T201"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
strict = true
files = ["src"]
python_version = "3.11"

[[tool.mypy.overrides]]
module = ["sqlite_vec", "sqlite_vec.*"]
ignore_missing_imports = true

# mcp SDK 1.27 doesn't ship complete type stubs — its decorator-based
# handler-registration pattern (e.g. @server.list_tools()) is typed as
# returning an untyped wrapper, which mypy strict mode flags as
# no-untyped-call / untyped-decorator. The pattern is correct usage per
# the SDK's documented interface; treating it as Any inside our codebase
# is the right tradeoff. Re-evaluate when mcp ships full stubs.
[[tool.mypy.overrides]]
module = ["mcp", "mcp.*"]
disallow_untyped_decorators = false
disallow_untyped_calls = false

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-ra --strict-markers"
markers = [
  "embed: tests that require the embedding model (slow, downloads ~120 MB)",
  "scrub: secret-scrubber tests; these are the pre-commit canary",
  "perf: performance budget tests",
]
