name: ci

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # 3.11: daily stdio-cleanliness run at 06:00 UTC. Catches upstream
    # library regressions silently introducing stdout writes (e.g. a
    # sentence-transformers update adds a progress bar). Lowest GitHub
    # Actions queue contention. Only the `stdio` job runs on schedule;
    # the others gate on `github.event_name != 'schedule'`.
    - cron: '0 6 * * *'

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fast:
    name: fast (${{ matrix.os }} / py${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    if: github.event_name != 'schedule'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
      - name: install python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}
      - name: sync deps
        run: uv sync --python ${{ matrix.python-version }}
      - name: ruff lint
        run: uv run --python ${{ matrix.python-version }} ruff check .
      - name: ruff format check
        run: uv run --python ${{ matrix.python-version }} ruff format --check .
      - name: mypy
        run: uv run --python ${{ matrix.python-version }} mypy src
      - name: pytest (no embed)
        # Fast lane excludes tests/test_recorded_sessions.py — those are
        # subprocess-driven MCP protocol-conformance tests owned by the
        # `stdio` lane (locked Phase 3.12 §9). Running them here too
        # would (a) duplicate the work N×matrix-cells and (b) spread
        # S1's 30s idle cost across every cell. See the comment on the
        # `stdio` job below for the lane-ownership boundary.
        run: |
          uv run --python ${{ matrix.python-version }} pytest -m "not embed" \
            --ignore=tests/test_recorded_sessions.py

  embed:
    name: embed (ubuntu / py3.12)
    runs-on: ubuntu-latest
    if: github.event_name != 'schedule'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # regression gate needs git history for origin/main lookup
      - uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
      - name: install python 3.12
        run: uv python install 3.12
      - name: cache HuggingFace models
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-${{ runner.os }}-bge-small-en-v1.5
      - name: cache nl2bash dataset
        uses: actions/cache@v4
        with:
          path: ~/.recall/datasets/nl2bash
          key: nl2bash-v1
      - name: sync deps
        run: uv sync --python 3.12
      - name: pytest (embed only)
        # Match the env override below — the behavior-preservation test
        # (added 2.7) calls run_eval() inside pytest, which inherits
        # HARD_RUNTIME_FAIL_S=120 from runner.py's default. CI Linux
        # semantic eval is ~260s; without this override the test errors
        # on the runtime gate before it gets to compute recall@5.
        # Composition bug #7 in CLAUDE.md — context-aware defaults are
        # the deeper fix; this one-line workflow override patches the
        # symptom for now.
        env:
          RECALL_EVAL_HARD_FAIL_S: "360"
        # --ignore the stdio-cleanliness file: the cold-cache test in
        # there is @pytest.mark.embed but is owned by the dedicated
        # `stdio` lane (3.11). Running it here would double the
        # ~25s cold-cache cost without gating on anything new.
        run: uv run --python 3.12 pytest -m embed --ignore=tests/test_stdio_cleanliness.py
      - name: recall eval (nl2bash + dogfood)
        # GitHub-hosted Linux is ~7x slower than M-series Mac for embedding
        # work (CPU vs MPS). Two separate budgets: per-ranker hard fail
        # (RECALL_EVAL_HARD_FAIL_S, set in runner.py) is the anomaly
        # detector for any single ranker; all-rankers cumulative
        # (RECALL_EVAL_ALL_HARD_FAIL_S) is the aggregate gate across the
        # five-ranker × two-dataset loop. Local defaults are 120s / 180s;
        # CI raises both to absorb the runner-class delta. See CLAUDE.md
        # "Eval harness". `--dataset all` runs both lanes; the regression
        # gate then enforces aggregate ±0.01 on nl2bash and per-query
        # PASS→FAIL on dogfood (separate gates, both on semantic only).
        env:
          RECALL_EVAL_HARD_FAIL_S: "360"
          # 600 → 660 at 2.7.5-hotfix: the deterministic-tie-breaking
          # structural fix adds ~57s to semantic's CI Linux runtime
          # (full O(n log n) argsort vs O(n) argpartition over the
          # 10624 × 11348 similarity matrix). The 600s ceiling was
          # designed against the smaller pre-hotfix semantic cost; 660s
          # reflects the new permanent steady-state. Naive removal from
          # --ranker all default does most of the work (-63s on Linux);
          # this 60s ceiling bump absorbs the algorithmic structural
          # cost. NOT the fallback-chain option-2 emergency relief
          # (which was 720s) — separate-concern recalibration.
          RECALL_EVAL_ALL_HARD_FAIL_S: "660"
        run: uv run --python 3.12 recall eval --dataset all --output /tmp/ci_eval.json
      - name: regression gate (PR only)
        if: github.event_name == 'pull_request'
        run: uv run --python 3.12 python .github/scripts/check_eval_regression.py /tmp/ci_eval.json

  stdio:
    name: stdio (ubuntu / py3.12)
    runs-on: ubuntu-latest
    # === Lane ownership boundary (locked Phase 3.11 + 3.12 §9) ===
    #
    # The `stdio` lane owns ALL subprocess-driven MCP tests:
    #   - tests/test_stdio_cleanliness.py (3.11): transport invariant —
    #     subprocess + cold-cache stress + AST check + T201 invocation.
    #   - tests/test_recorded_sessions.py (3.12): protocol conformance —
    #     5 recorded scenarios (S1 long_idle, S2 happy_path, S3 error
    #     recovery, S4 multiple_back_to_back, S6 pipelined_requests) +
    #     loader/matcher self-tests.
    #
    # Both files share the MCPSubprocessSession fixture and the
    # subprocess setup cost; running them in the same lane amortizes
    # checkout + uv sync once. Fast lane excludes test_recorded_sessions
    # via --ignore (see fast lane above) so S1's 30s idle test isn't
    # paid 6× across the matrix.
    #
    # Per F2 lock (3.11): Linux-only for v1; M-series stdio cleanliness
    # verified via maintainer manual smoke (tests/manual_smoke.md
    # Section D). Daily schedule trigger catches upstream regressions
    # (e.g. HF adds progress bar in a future release silently; SDK
    # update changes initialize-response shape; etc.).
    #
    # Runtime envelope: ~50s (cold-cache ~25s + S1 idle 30s + ~5s
    # remaining; some overlap from concurrent test execution). If
    # lane runtime grows past 90s on three consecutive runs, evaluate
    # splitting into transport-cleanliness vs protocol-conformance
    # lanes per CLAUDE.md "Deferred items".
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
      - name: install python 3.12
        run: uv python install 3.12
      - name: sync deps
        run: uv sync --python 3.12
      - name: stdio + recorded-session suite
        # PYTHONUNBUFFERED ensures stdout writes from the subprocess
        # under test are flushed to the parent without buffering — we
        # need byte-for-byte determinism on what reaches stdout.
        env:
          PYTHONUNBUFFERED: "1"
        run: |
          uv run --python 3.12 pytest \
            tests/test_stdio_cleanliness.py \
            tests/test_recorded_sessions.py \
            -v

  fixture-drift-warning:
    name: fixture drift warning
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    # 3.12 lightweight surface for the fixture-drift policy. When a PR
    # touches both tests/fixtures/sessions/*.jsonl AND
    # src/recall/{server,tools}.py, emit a ::warning:: annotation
    # asking the reviewer to verify fixture changes match the surface
    # change line-by-line — not rubber-stamp. Doesn't block merge.
    # Reviewer attention is the weakest enforcement link; this surfaces
    # the requirement at PR time so it's visible, not just memorial.
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - name: detect fixture-drift PR
        run: |
          base="origin/${{ github.base_ref }}"
          changed=$(git diff --name-only "$base"...HEAD)
          fixt=$(echo "$changed" | grep -E '^tests/fixtures/sessions/' || true)
          surf=$(echo "$changed" | grep -E '^src/recall/(server|tools)\.py$' || true)
          if [ -n "$fixt" ] && [ -n "$surf" ]; then
            echo "::warning::Fixture drift detected — both tests/fixtures/sessions/* AND src/recall/{server,tools}.py touched. Reviewer must verify fixture changes match the surface change line-by-line; do not rubber-stamp. See CLAUDE.md §5 'Recorded session fixtures' for the policy."
          else
            echo "no fixture drift detected on this PR"
          fi

  scrub-canary:
    name: scrubber test count canary
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: detect scrub-touching PR
        id: touched
        run: |
          if git diff --name-only origin/${{ github.base_ref }}...HEAD \
              | grep -E '^(src/recall/scrub\.py|tests/test_scrub\.py)$' >/dev/null; then
            echo "touched=1" >> "$GITHUB_OUTPUT"
          else
            echo "touched=0" >> "$GITHUB_OUTPUT"
            echo "scrub.py / test_scrub.py not touched; skipping canary."
          fi
      - uses: astral-sh/setup-uv@v3
        if: steps.touched.outputs.touched == '1'
        with:
          enable-cache: true
      - name: sync deps
        if: steps.touched.outputs.touched == '1'
        run: uv sync
      - name: count head scrub tests
        if: steps.touched.outputs.touched == '1'
        id: head
        run: |
          if [ -f tests/test_scrub.py ]; then
            count=$(uv run pytest --collect-only -q tests/test_scrub.py 2>/dev/null | grep -c '::' || true)
          else
            count=0
          fi
          echo "count=$count" >> "$GITHUB_OUTPUT"
      - name: count base scrub tests
        if: steps.touched.outputs.touched == '1'
        id: base
        run: |
          base_ref="origin/${{ github.base_ref }}"
          # Stash isn't reliable here: PR branches usually have these files
          # committed, not modified, so stash skips them. cp to /tmp instead so
          # save+restore works whether the file was committed, modified, or new.
          [ -f tests/test_scrub.py ] && cp tests/test_scrub.py /tmp/head_test_scrub.py
          [ -f src/recall/scrub.py ] && cp src/recall/scrub.py /tmp/head_scrub.py
          # Wipe, then ask git for base's version. If base lacks the file, it
          # stays absent — which is the correct count=0 case for new-file PRs.
          rm -f tests/test_scrub.py src/recall/scrub.py
          git checkout "$base_ref" -- tests/test_scrub.py 2>/dev/null || true
          git checkout "$base_ref" -- src/recall/scrub.py 2>/dev/null || true
          if [ -f tests/test_scrub.py ]; then
            count=$(uv run pytest --collect-only -q tests/test_scrub.py 2>/dev/null | grep -c '::' || true)
          else
            count=0
          fi
          echo "count=$count" >> "$GITHUB_OUTPUT"
          # Restore head versions so subsequent steps / jobs see HEAD's tree.
          rm -f tests/test_scrub.py src/recall/scrub.py
          [ -f /tmp/head_test_scrub.py ] && cp /tmp/head_test_scrub.py tests/test_scrub.py
          [ -f /tmp/head_scrub.py ] && cp /tmp/head_scrub.py src/recall/scrub.py
      - name: assert non-decreasing
        if: steps.touched.outputs.touched == '1'
        run: |
          head=${{ steps.head.outputs.count }}
          base=${{ steps.base.outputs.count }}
          echo "scrub test count: base=$base, head=$head"
          if [ "$head" -lt "$base" ]; then
            echo "::error::scrub test count decreased ($base -> $head). PRs touching scrub must not remove coverage."
            exit 1
          fi
