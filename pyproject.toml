[project]
name = "recall-mcp"
version = "0.0.1"
description = "Semantic shell history MCP server for Claude Desktop and Claude Code."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Tarun Sharma" }]
requires-python = ">=3.11"
keywords = [
  "mcp",
  "shell",
  "history",
  "semantic-search",
  "claude",
  "atuin",
  "zsh",
  "bash",
  "fish",
]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Operating System :: MacOS :: MacOS X",
  "Operating System :: POSIX :: Linux",
  "Topic :: Utilities",
]
dependencies = [
  "pydantic>=2.13",
  "sqlite-vec>=0.1.6",
]

# Mirror of [dependency-groups].dev below, exposed as a PEP 621 extra so
# `pip install -e ".[dev]"` works for non-uv users. PEP 735 dependency
# groups only land on pip 25+; optional-dependencies is universal. Keep
# this list and [dependency-groups].dev in sync — both must change together.
[project.optional-dependencies]
dev = [
  "pytest>=9.0",
  "pytest-asyncio>=1.3",
  "ruff>=0.15",
  "mypy>=1.20",
]

[project.scripts]
recall = "recall.cli:main"
recall-mcp = "recall.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
  "pytest>=9.0",
  "pytest-asyncio>=1.3",
  "ruff>=0.15",
  "mypy>=1.20",
]

[tool.hatch.build.targets.wheel]
packages = ["src/recall"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
  "E",   # pycodestyle errors
  "F",   # pyflakes
  "W",   # pycodestyle warnings
  "I",   # isort
  "B",   # flake8-bugbear
  "UP",  # pyupgrade
  "SIM", # flake8-simplify
  "RUF", # ruff-specific
]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
strict = true
files = ["src"]
python_version = "3.11"

[[tool.mypy.overrides]]
module = ["sqlite_vec", "sqlite_vec.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-ra --strict-markers"
markers = [
  "embed: tests that require the embedding model (slow, downloads ~120 MB)",
  "scrub: secret-scrubber tests; these are the pre-commit canary",
  "perf: performance budget tests",
]
