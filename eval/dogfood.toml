# 5 NL queries. Field semantics:
#   id    — query identifier (matches the eyeball-pass numbering used in
#           the 2.6.5 review; preserved for traceability)
#   tier  — paraphrase difficulty: "L" (NL shares ≥1 content token with
#           the gold), "M" (related vocabulary, no shared content tokens),
#           "H" (no overlap, fully abstracted intent)
#   short — short label printed in the per-query inline output
#   nl    — the NL query the ranker sees
#   gold  — single gold command (string)
#   golds — multi-reference golds (array). Use either gold or golds
#           per query; arity signals via field name.
#   star  — true marks the headline query (the domain-knowledge test)

[[query]]
id = 42
tier = "L"
short = "grep useAgent"
nl = "find useAgent references in the frontend"
gold = "grep -r \"useAgent\" frontend"

